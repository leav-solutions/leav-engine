query SmartFilterListValues($library: ID!, $attribute: ID!, $recordFilters: [RecordFilterInput]) {
    listDistinctValues(library: $library, attribute: $attribute, recordFilters: $recordFilters) {
        count
        ... on LinkDistinctValues {
            recordValue: value {
                ...RecordIdentity
            }
        }
        ... on StandardDistinctValues {
            standardValue: value
        }
    }
}
