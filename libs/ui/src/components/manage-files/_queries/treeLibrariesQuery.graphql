query GET_TREE_LIBRARIES($treeId: [ID!], $library: String) {
    trees(filters: {id: $treeId, library: $library}) {
        totalCount
        list {
            id
            behavior
            system
            libraries {
                library {
                    id
                    label
                    behavior
                    system
                }
                settings {
                    allowMultiplePositions
                    allowedChildren
                    allowedAtRoot
                }
            }
        }
    }
}
