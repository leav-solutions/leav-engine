fragment PropertyValue on GenericValue {
    id_value # Needed to remove one value of a multivalued attribute (column split, LEAVC-1073).
    ... on Value {
        valuePayload: payload
        valueRawPayload: raw_payload
    }
    ... on LinkValue {
        linkPayload: payload {
            ...RecordIdentity
        }
    }
    ... on TreeValue {
        treePayload: payload {
            id # The nodeId, the only reliable key of a node (LEAVC-1074, column split lot 3).
            record {
                ...RecordIdentity
            }
        }
    }
}

fragment AttributeProperties on Attribute {
    id
    label
    type
    format
    multiple_values
    multi_link_display_option
    multi_tree_display_option
    # The linked tree id is needed to load the kanban grouping-axis columns (the tree's nodes).
    ... on TreeAttribute {
        linked_tree {
            id
        }
    }
}

query ExplorerLibraryData(
    $libraryId: ID!
    $attributeIds: [ID!]!
    $pagination: RecordsPagination
    $filters: [RecordFilterInput]
    $multipleSort: [RecordSortInput!]
    $searchQuery: String
) {
    records(
        library: $libraryId
        filters: $filters
        pagination: $pagination
        multipleSort: $multipleSort
        searchQuery: $searchQuery
    ) {
        totalCount
        list {
            ...RecordIdentity
            active
            permissions {
                create_record
                delete_record
            }
            properties(attributeIds: $attributeIds) {
                attributeId
                attributeProperties {
                    ...AttributeProperties
                }
                values {
                    ...PropertyValue
                }
            }
        }
    }
}

fragment LinkProperty on GenericValue {
    id_value
    ... on LinkValue {
        payload {
            ...RecordIdentity
            properties(attributeIds: $attributeIds) {
                attributeId
                attributeProperties {
                    ...AttributeProperties
                }
                values {
                    ...PropertyValue
                }
            }
        }
    }
}

query ExplorerLinkData($attributeIds: [ID!]!, $parentLibraryId: ID!, $parentRecordId: String, $linkAttributeId: ID!) {
    records(
        library: $parentLibraryId
        filters: [{field: "id", condition: EQUAL, value: $parentRecordId}]
        retrieveInactive: true
    ) {
        list {
            id
            whoAmI {
                id
                library {
                    id
                }
            }
            property(attribute: $linkAttributeId) {
                ...LinkProperty
            }
        }
    }
}
