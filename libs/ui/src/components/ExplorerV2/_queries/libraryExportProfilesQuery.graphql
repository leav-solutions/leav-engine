query libraryExportProfiles($libraryId: [ID!]) {
    libraries(filters: {id: $libraryId}) {
        list {
            id
            exportProfiles {
                defaultProfile
                profiles {
                    label
                    columns {
                        columnLabel
                        attribute
                    }
                    error {
                        message
                    }
                }
            }
        }
    }
}
