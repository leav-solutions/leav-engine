# The library's metadata and the metadata of ALL its attributes, loaded once upfront (Explorer.tsx):
# the records queries now carry data only. Covers the column headers and cells
# (label/type/format/multi_*), the kanban grouping axis (linked_tree), the mass-edition workflow
# classification (permissions_conf_dependent_values), the generate-previews action gate (behavior),
# the explorer title (label) and the create action (behavior picks the creation modal,
# permissions.create_record gates the button). Replaces the derivation from records.list[0] and the
# MassEditableAttributes, KanbanAxisAttribute, GET_LIBRARY_BY_ID and ExplorerLibraryDetails queries.
fragment ExplorerV2AttributeProperties on Attribute {
    id
    label
    type
    format
    multiple_values
    multi_link_display_option
    multi_tree_display_option
    ... on LinkAttribute {
        linked_library {
            id
            recordIdentityConf {
                color
            }
        }
    }
    ... on TreeAttribute {
        linked_tree {
            id
            libraries {
                library {
                    id
                    recordIdentityConf {
                        color
                    }
                }
            }
        }
        # Workflow dependencies: they classify the attribute for mass edition
        # (hasEmptyDependency / isSimpleWorkflow / isMonoDependencyWorkflow).
        permissions_conf_dependent_values {
            dependenciesTreeAttributes {
                id
                ... on TreeAttribute {
                    linked_tree {
                        libraries {
                            library {
                                id
                            }
                        }
                    }
                }
            }
        }
    }
}

query ExplorerV2LibraryMetadata($libraryId: ID!) {
    libraries(filters: {id: [$libraryId]}) {
        list {
            id
            label
            behavior
            recordIdentityConf {
                color
            }
            permissions {
                create_record
            }
            attributes {
                ...ExplorerV2AttributeProperties
            }
        }
    }
}
