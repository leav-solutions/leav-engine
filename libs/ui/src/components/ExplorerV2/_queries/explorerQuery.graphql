fragment PropertyValue on GenericValue {
    id_value # Needed to remove one value of a multivalued attribute (column split, LEAVC-1073).
    ... on Value {
        valuePayload: payload
        valueRawPayload: raw_payload
    }
    ... on LinkValue {
        linkPayload: payload {
            ...RecordIdentity
        }
    }
    ... on TreeValue {
        treePayload: payload {
            id # The nodeId, the only reliable key of a node (LEAVC-1074, column split lot 3).
            record {
                ...RecordIdentity
            }
        }
    }
}

query ExplorerV2LibraryData(
    $libraryId: ID!
    $attributeIds: [ID!]!
    # Defaulted so that any caller which does not split its columns stays valid.
    $badgeAttributeIds: [ID!]! = []
    $pagination: RecordsPagination
    $filters: [RecordFilterInput]
    $multipleSort: [RecordSortInput!]
    $searchQuery: String
) {
    records(
        library: $libraryId
        filters: $filters
        pagination: $pagination
        multipleSort: $multipleSort
        searchQuery: $searchQuery
    ) {
        totalCount
        list {
            ...RecordIdentity
            active
            permissions {
                create_record
                delete_record
            }
            properties(attributeIds: $attributeIds) {
                attributeId
                values {
                    ...PropertyValue
                }
            }
            # Same field, second argument set: the count-badge columns. Aliasing is what lets one
            # static document carry two different selection sets for the same `properties` field.
            # Such a column only needs the cardinality of its values, never the linked identities:
            # `valuesCount` spares the server the whole `whoAmI` resolution of every linked record,
            # and spares the wire the values themselves (LEAVC-1119).
            badgeProperties: properties(attributeIds: $badgeAttributeIds) {
                attributeId
                valuesCount
            }
        }
    }
}

fragment ExplorerV2LinkProperty on GenericValue {
    id_value
    ... on LinkValue {
        payload {
            ...RecordIdentity
            properties(attributeIds: $attributeIds) {
                attributeId
                values {
                    ...PropertyValue
                }
            }
            badgeProperties: properties(attributeIds: $badgeAttributeIds) {
                attributeId
                valuesCount
            }
        }
    }
}

query ExplorerV2LinkData(
    $attributeIds: [ID!]!
    $badgeAttributeIds: [ID!]! = []
    $parentLibraryId: ID!
    $parentRecordId: String
    $linkAttributeId: ID!
) {
    records(
        library: $parentLibraryId
        filters: [{field: "id", condition: EQUAL, value: $parentRecordId}]
        retrieveInactive: true
    ) {
        list {
            id
            whoAmI {
                id
                library {
                    id
                }
            }
            property(attribute: $linkAttributeId) {
                ...ExplorerV2LinkProperty
            }
        }
    }
}
