fragment FormElementWithValues on FormElementWithValues {
    id
    containerId
    uiElementType
    attribute {
        ...RecordFormAttribute
    }
    type
    valueError
    values {
        ...ValueDetails
    }
}

query GET_FORM_ELEMENT_VALUES(
    $recordId: String,
    $libraryId: String!,
    $formId: String!,
    $version: [ValueVersionInput!],
    $elementIds: [ID!]
) {
    getFormElementValues(recordId: $recordId, libraryId: $libraryId, formId: $formId, version: $version, elementIds: $elementIds) {
        ...FormElementWithValues
    }
}
