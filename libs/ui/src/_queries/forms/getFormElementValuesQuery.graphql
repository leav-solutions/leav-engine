fragment RecordFormElementValues on FormElementValues {
    id
    valueError
    values {
        ...ValueDetails
    }
}

query GET_RECORD_FORM_ELEMENTS_VALUES(
    $recordId: String,
    $libraryId: String!,
    $formId: String!,
    $version: [ValueVersionInput!],
    $elementIds: [ID!]
) {
    getRecordFormElementsValues(recordId: $recordId, libraryId: $libraryId, formId: $formId, version: $version, elementIds: $elementIds) {
        ...RecordFormElementValues
    }
}
