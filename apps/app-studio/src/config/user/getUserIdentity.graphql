query getUserIdentity {
    me {
        id
        whoAmI {
            id
            label
            library {
                id
            }
        }
        user_groups: property(attribute: "user_groups") {
            ... on TreeValue {
                payload {
                    record {
                        whoAmI {
                            label
                        }
                    }
                }
            }
        }
    }
}
