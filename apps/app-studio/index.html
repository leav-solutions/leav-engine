<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="{{GLOBAL_BASE_URL}}/global-favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Powered by LEAV-Engine"
    />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"/>
    <title>LEAV Engine - App Studio - REPLACE ME</title>
    <script>
        window.__dynamic_base__ = `{{APPLICATION_BASE_URL}}`;
        window.__global_base_url__ = `{{GLOBAL_BASE_URL}}`;
        window.__bugsnag_api_key__ = `{{BUGSNAG_API_KEY}}`;
        window.__bugsnag_app_version__ = `{{BUGSNAG_APP_VERSION}}`;
        window.__bugsnag_release_stage__ = `{{BUGSNAG_RELEASE_STAGE}}`;
    </script>
    <script>
      var matomoUrl = `{{MATOMO_URL}}`;
      var matomoSiteId = `{{MATOMO_SITE_ID}}`;
      if (matomoUrl && matomoSiteId) {
          // Code provided by Matomo
          var _paq = (window._paq = window._paq || []);
          _paq.push(['trackPageView']);
          _paq.push(['enableLinkTracking']);
          (function () {
              _paq.push(['setTrackerUrl', matomoUrl + 'matomo.php']);
              _paq.push(['setSiteId', matomoSiteId]);
              var d = document,
                  g = d.createElement('script'),
                  s = d.getElementsByTagName('script')[0];
              g.async = true;
              g.src = matomoUrl + 'matomo.js';
              s.parentNode.insertBefore(g, s);
          })();
      }
  </script>
  </head>
  <body>
    <script type="module" src="/src/index.tsx"></script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
