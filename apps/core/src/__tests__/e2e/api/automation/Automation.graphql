query GetAutomationRules($filters: AutomationRulesFiltersInput) {
    automationRules(filters: $filters) {
        list {
            id
            label
            description
            active
            createdAt
            createdBy
            modifiedAt
            modifiedBy
            trigger {
                synchronous
                eventAction
                eventTopic {
                    library
                }
            }
            pipeline {
                steps {
                    type
                    name
                    params
                }
            }
        }
    }
}

mutation CreateAutomationRule($rule: CreateAutomationRuleInput!) {
    createAutomationRule(rule: $rule) {
        id
        label
        modifiedAt
        active
        trigger {
            synchronous
            eventAction
            eventTopic {
                library
            }
        }
        pipeline {
            steps {
                type
                name
                params
            }
        }
    }
}

mutation UpdateAutomationRule($rule: UpdateAutomationRuleInput!) {
    updateAutomationRule(rule: $rule) {
        id
        label
        description
        active
        modifiedAt
        trigger {
            synchronous
            eventAction
            eventTopic {
                library
            }
        }
        pipeline {
            steps {
                type
                name
                params
            }
        }
    }
}

mutation DeleteAutomationRule($ruleId: ID!) {
    deleteAutomationRule(ruleId: $ruleId) {
        id
    }
}

query ListAutomationTriggersDef {
    automationTriggersDef {
        eventAction
        topics
        synchronicity
    }
}

query GetAutomationRuleForm($formType: AutomationRuleJsonSchemaFormType!) {
    automationRuleForm(formType: $formType) {
        jsonSchema
        uiSchema
    }
}

query ListAutomationActionsDef {
    automationActionsDef
}
