query GetAutomationRules {
    automationRules {
        list {
            id
            label
            description
            active
            createdAt
            createdBy
            modifiedAt
            modifiedBy
        }
    }
}

mutation CreateAutomationRule($rule: CreateAutomationRuleInput!) {
    createAutomationRule(rule: $rule) {
        id
        label
    }
}
