##### Common properties #####
x-message-broker-image: &message_broker_image "rabbitmq:3.13-management-alpine"
x-traefik-image: &traefik_image "traefik:2.11.31"
x-redis-image: &redis_image "redis:7.4-alpine3.21"
x-arango-image: &arango_image "arangodb:3.12"

x-dir-core: &dir-core /app/apps/core
x-dir-admin: &dir-admin /app/apps/admin
x-dir-data_studio: &dir-data_studio /app/apps/data-studio
x-dir-app_studio: &dir-app_studio /app/apps/app-studio
x-dir-login: &dir-login /app/apps/login
x-dir-portal: &dir-portal /app/apps/portal
x-dir-automate_scan: &dir-automate_scan /app/apps/automate-scan
x-dir-preview_generator: &dir-preview_generator /app/apps/preview-generator
x-dir-sync_scan: &dir-sync_scan /app/apps/sync-scan
x-dir-mcp_runtime: &dir-mcp_runtime /app/apps/mcp-runtime

x-volume-yarn: &volume-yarn yarn:/app/.yarn
x-volume-shared-modules: &volume-shared-modules node_modules_shared:/app/node_modules
x-volume-core-modules: &volume-core-modules node_modules_core:/app/apps/core/node_modules
x-volume-admin-modules: &volume-admin-modules node_modules_admin:/app/apps/admin/node_modules
x-volume-data_studio-modules: &volume-data_studio-modules node_modules_data-studio:/app/apps/data-studio/node_modules
x-volume-app_studio-modules: &volume-app_studio-modules node_modules_app-studio:/app/apps/app-studio/node_modules
x-volume-login-modules: &volume-login-modules node_modules_login:/app/apps/login/node_modules
x-volume-portal-modules: &volume-portal-modules node_modules_portal:/app/apps/portal/node_modules
x-volume-preview_generator-modules: &volume-preview_generator-modules node_modules_preview-generator:/app/apps/preview-generator/node_modules
x-volume-automate_scan-modules: &volume-automate_scan-modules node_modules_automate-scan:/app/apps/automate-scan/node_modules
x-volume-sync_scan-modules: &volume-sync_scan-modules node_modules_sync-scan:/app/apps/sync-scan/node_modules
x-volume-mcp_runtime-modules: &volume-mcp_runtime-modules node_modules_mcp-runtime:/app/apps/mcp-runtime/node_modules
x-volume-config_manager-modules: &volume-config_manager-modules node_modules_config-manager:/app/libs/config-manager/node_modules
x-volume-app_root_path-modules: &volume-app_root_path-modules node_modules_app-root-path:/app/libs/app-root-path/node_modules
x-volume-utils-modules: &volume-utils-modules node_modules_utils:/app/libs/utils/node_modules
x-volume-ui-modules: &volume-ui-modules node_modules_ui:/app/libs/ui/node_modules
x-volume-message_broker-modules: &volume-message_broker-modules node_modules_message-broker:/app/libs/message-broker/node_modules
x-volume-monitoring_server-modules: &volume-monitoring_server-modules node_modules_monitoring-server:/app/libs/monitoring-server/node_modules
x-volume-logger-modules: &volume-logger-modules node_modules_logger:/app/libs/logger/node_modules

# Host path is relative to the docker folder
x-mount_point-repo: &mount_point-repo ../:/app
x-mount_point-scripts: &mount_point-scripts ./scripts:/scripts
x-mount_point-files: &mount_point-files ../files/:/files
x-mount_point-previews: &mount_point-previews ../previews/:/results
x-mount_point-exports: &mount_point-exports ../exports:/exports
x-mount_point-imports: &mount_point-imports ../imports:/imports
x-mount_point-cache: &mount_point-cache ../cache:/cache
x-mount_point-home-yarnrc: &mount_point-home-yarnrc ~/.yarnrc.yml:/root/.yarnrc.yml:ro
# Must be after volume-yarn mount because it overrides .yarn/releases folder
x-mount_point-yarn_releases: &mount_point-yarn_releases ../.yarn/releases:/app/.yarn/releases

# Lists of allowed and ignored files
# Use ", " characters as separators between files
# You can use glob pattern (https://github.com/isaacs/node-glob#readme)
x-allow-files-list: &allow-list ""
x-ignore-files-list: &ignore-list ""

x-env-core: &env-core
  NODE_ENV: development
  NODE_OPTIONS: "--trace-warnings"
  ARANGO_URL: http://root:@arangodb:8529
  DB_NAME: leav_core
  INSTANCE_ID: leav_engine
  AUTH_KEY: 999999
  APP_ROOT_PATH: *dir-core
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: 4001
  SERVER_PUBLIC_URL: http://core.leav.localhost
  SERVER_UPLOAD_LIMIT: "15000mb"
  SERVER_SUPPORT_EMAIL: support@example.com
  OIDC_POST_LOGOUT_REDIRECT_URI: http://core.leav.localhost
  REDIS_HOST: redis
  REDIS_PORT: 6379
  FILES_ROOT_PATHS: files1:/files
  MAILER_HOST: mailpit
  MAILER_PORT: 1025
  MAILER_REQUIRE_TLS: "false"
  MAILER_FROM_NAME: "Leav Engine"
  MAILER_FROM_EMAIL: leav@example.com
  NOTIFICATION_ENABLE: "true"
  NOTIFICATION_EMAIL_ENABLE: "false" # Disable by default because mailpit may not be started (docker compose --profile 'mail')
  NOTIFICATION_WEBSOCKET_ENABLE: "true"
  SERVER_ADMIN_LOGIN: admin
  SERVER_ADMIN_PASSWORD: admin
  SERVER_ADMIN_EMAIL: admin@example.com
  ALLOW_FILES_LIST: *allow-list
  IGNORE_FILES_LIST: *ignore-list
  # Uncomment following 3 lines if you want to serve the apps from a subpath (eg. /campaigns-manager)
  # SERVER_PUBLIC_URL: http://core.leav.localhost/campaigns-manager
  # SERVER_BASE_PATH: /campaigns-manager
  # OIDC_POST_LOGOUT_REDIRECT_URI: http://core.leav.localhost/campaigns-manager

x-env-amqp: &env-amqp
  AMQP_PROTOCOL: "amqp"
  AMQP_HOST: message-broker
  AMQP_USERNAME: guest
  AMQP_PWD: guest
  AMQP_PORT: 5672

x-env-react: &env-react
  REACT_APP_CORE_URL: http://core.leav.localhost
  REACT_APP_API_URL: http://core.leav.localhost/graphql
  REACT_APP_WS_URL: ws://core.leav.localhost/graphql
  REACT_APP_DEFAULT_LANG: fr
  REACT_APP_AVAILABLE_LANG: fr,en
  REACT_APP_LOGIN_ENDPOINT: /app/login/
  SKIP_PREFLIGHT_CHECK: "true"
  TSC_WATCHFILE: UseFsEventsWithFallbackDynamicPolling # To reduce CPU usage of TSC's file watching
  ESLINT_NO_DEV_ERRORS: "true" # To keep compiling on eslint errors

x-env-automate-scan: &env-automate-scan
  ALLOW_FILES_LIST: *allow-list
  IGNORE_FILES_LIST: *ignore-list
  NODE_ENV: development
  REDIS_HOST: redis
  REDIS_PORT: 6379
  ROOT_PATH: /files
  ROOT_KEY: files1
  APP_ROOT_PATH: *dir-automate_scan

x-env-logger: &env-logger
  LOG_LEVEL: "silly"
  LOG_USE_JSON_FORMAT: "false"
  LOG_ADD_LOCATION_INFO: "false"
  LOG_ADD_TIMESTAMP: "false"
  # LOG_ADDITIONAL_META_ENV: "local"
  # LOG_ADDITIONAL_META_CLIENT: "aristid"
  # LOG_ADDITIONAL_META_VERSION: "develop"
  # LOG_ADDITIONAL_META_APP: "xstream"

x-env-mcp-runtime: &env-mcp-runtime # Internal Docker network URL — core listens on port 4001 inside the leav network
  CORE_URL: http://core:4001

x-env-monitoring: &env-monitoring
  OTEL_AUTO_INSTRUMENT: ${OTEL_AUTO_INSTRUMENT:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_NODE_RESOURCE_DETECTORS: env,host,serviceinstance
  OTEL_LOGS_EXPORTER: none # no yet loki for now at least
  OTEL_TRACES_EXPORTER: none # no yet tempo for now at least
  # OTEL_LOG_LEVEL: info

x-env-sync-scan: &env-sync-scan
  ALLOW_FILES_LIST: *allow-list
  IGNORE_FILES_LIST: *ignore-list
  FILESYSTEM_ABSOLUTE_PATH: /files
  GRAPHQL_URI: http://core:4001/graphql
  GRAPHQL_API_KEY: ${GRAPHQL_API_KEY}
  APP_ROOT_PATH: *dir-sync_scan

x-env-admin: &env-admin
  APP_ROOT_PATH: *dir-admin

x-env-data-studio: &env-data-studio
  APP_ROOT_PATH: *dir-data_studio

x-env-login: &env-login
  APP_ROOT_PATH: *dir-login

x-env-portal: &env-portal
  APP_ROOT_PATH: *dir-portal

x-env-preview-generator: &env-preview-generator
  NODE_ENV: development
  INPUT_ROOT_PATH: /files
  OUTPUT_ROOT_PATH: /results
  ICC_PATH: /app/apps/preview-generator/profile/
  APP_ROOT_PATH: *dir-preview_generator

x-env-build-core: &env-build-core
  context: ../apps/core
  dockerfile: ../../docker/DOCKERFILES/CORE/Dockerfile

# Healthcheck with libs/monitoring-server module
x-healthcheck-localhost-44444: &healthcheck-localhost-44444
  test: ["CMD-SHELL", "nc -z localhost 44444 || exit 1"]
  start_period: 30s
  start_interval: 5s
  interval: 60s
  timeout: 2s
  retries: 50

############################

services:
  # The core is in charge of installing dependencies for ALL services. Each service must for wait the core and then
  # just do their job, not having to handle installation.
  core:
    build: *env-build-core
    stdin_open: true
    tty: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core.rule=Host(`core.leav.localhost`)"
      - "traefik.http.services.core.loadbalancer.server.port=4001"
      - "traefik.http.routers.core.entrypoints=web"
      - "traefik.http.routers.core.priority=10"
    environment:
      <<: [*env-core, *env-amqp, *env-logger, *env-monitoring]
      CORE_MODES: server,indexationManager,tasksManager:master,tasksManager:worker,filesManager,automation,sdo
      OTEL_SERVICE_NAME: core
    volumes:
      # We must load every volume for installation
      - *mount_point-repo
      - *mount_point-files
      - *mount_point-previews
      - *mount_point-scripts
      - *mount_point-exports
      - *mount_point-imports
      - *mount_point-cache
      - *mount_point-home-yarnrc
      - *volume-yarn
      - *volume-shared-modules
      - *volume-core-modules
      - *volume-admin-modules
      - *volume-data_studio-modules
      - *volume-login-modules
      - *volume-portal-modules
      - *volume-preview_generator-modules
      - *volume-automate_scan-modules
      - *volume-sync_scan-modules
      - *volume-mcp_runtime-modules
      - *volume-app_root_path-modules
      - *volume-config_manager-modules
      - *volume-logger-modules
      - *volume-message_broker-modules
      - *volume-monitoring_server-modules
      - *volume-ui-modules
      - *volume-utils-modules
      - *mount_point-yarn_releases
    ports:
      - "9229:9229"
      - "4001:4001"
    working_dir: *dir-core
    healthcheck: *healthcheck-localhost-44444
    depends_on:
      message-broker:
        condition: service_healthy
      arangodb:
        condition: service_healthy
    command: [sh, -c, "/scripts/start-core.sh"]
    networks:
      - default
      - monitoring

  # Logs collector in separate container because it depends in logs profile with elasticsearch
  logs-collector:
    profiles: ["logs"]
    build: *env-build-core
    stdin_open: true
    tty: true
    environment:
      <<: [*env-logger, *env-core, *env-amqp]
      CORE_MODE: logsCollector
    volumes:
      - *mount_point-repo
      - *mount_point-scripts
      - *volume-yarn
      - *volume-shared-modules
      - *volume-core-modules
      - *volume-app_root_path-modules
      - *volume-config_manager-modules
      - *volume-logger-modules
      - *volume-message_broker-modules
      - *volume-monitoring_server-modules
      - *volume-utils-modules
      - *mount_point-yarn_releases
    ports:
      - "9235:9235"
    working_dir: *dir-core
    healthcheck: *healthcheck-localhost-44444
    depends_on:
      core:
        condition: service_healthy
    command: [sh, -c, "yarn run start:watch"]

  admin:
    image: node:24.18.0-alpine3.24
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=(Host(`core.leav.localhost`) &&
        PathPrefix(`/app/admin`)) || Host(`admin.leav.localhost`)"
      - "traefik.http.services.admin.loadbalancer.server.port=3000"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.routers.admin.priority=100"
    environment:
      <<: [*env-react, *env-admin]
      PUBLIC_URL: http://core.leav.localhost/app/admin
      WDS_SOCKET_HOST: admin.leav.localhost
      WDS_SOCKET_PORT: 80
    volumes:
      - *mount_point-repo
      - *mount_point-scripts
      - *volume-yarn
      - *volume-admin-modules
      - *volume-shared-modules
      - *mount_point-yarn_releases
    working_dir: *dir-admin
    depends_on:
      core:
        condition: service_healthy
    command: [sh, -c, "yarn run start"]

  data-studio:
    image: node:24.18.0-alpine3.24
    stdin_open: true
    tty: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.data-studio.rule=(Host(`core.leav.localhost`) &&
        PathPrefix(`/app/data-studio`)) || Host(`data-studio.leav.localhost`)"
      - "traefik.http.services.data-studio.loadbalancer.server.port=3000"
      - "traefik.http.routers.data-studio.entrypoints=web"
      - "traefik.http.routers.data-studio.priority=100"
    environment:
      <<: [*env-react, *env-data-studio]
      PUBLIC_URL: http://core.leav.localhost/app/data-studio
      WDS_SOCKET_HOST: data-studio.leav.localhost
      WDS_SOCKET_PORT: 80
    volumes:
      - *mount_point-repo
      - *mount_point-scripts
      - *volume-yarn
      - *volume-shared-modules
      - *volume-data_studio-modules
      - *mount_point-yarn_releases
    working_dir: *dir-data_studio
    depends_on:
      core:
        condition: service_healthy
    command: [sh, -c, "yarn run start"]

  app-studio:
    image: node:24.18.0-alpine3.24
    stdin_open: true
    tty: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-studio.rule=(Host(`core.leav.localhost`) &&
        (PathPrefix(`/app/app-studio`) || PathPrefix(`/app/explorer-studio`) ||
        PathPrefix(`/app/home`))) || Host(`app-studio.leav.localhost`)"
      - "traefik.http.services.app-studio.loadbalancer.server.port=3000"
      - "traefik.http.routers.app-studio.entrypoints=web"
      - "traefik.http.routers.app-studio.priority=100"
    environment:
      <<: [*env-react]
      PUBLIC_URL: http://core.leav.localhost/app/app-studio
      WDS_SOCKET_HOST: app-studio.leav.localhost
      WDS_SOCKET_PORT: 80
    volumes:
      - *mount_point-repo
      - *mount_point-scripts
      - *volume-yarn
      - *volume-shared-modules
      - *volume-app_studio-modules
      - *mount_point-yarn_releases
    working_dir: *dir-app_studio
    depends_on:
      core:
        condition: service_healthy
    command: [sh, -c, "yarn run start"]

  login:
    image: node:24.18.0-alpine3.24
    stdin_open: true
    tty: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.login.rule=(Host(`core.leav.localhost`) &&
        PathPrefix(`/app/login`)) || Host(`login.leav.localhost`)"
      - "traefik.http.services.login.loadbalancer.server.port=3000"
      - "traefik.http.routers.login.entrypoints=web"
      - "traefik.http.routers.login.priority=100"
    environment:
      <<: [*env-react, *env-login]
      PUBLIC_URL: http://core.leav.localhost/app/login
      WDS_SOCKET_HOST: login.leav.localhost
      WDS_SOCKET_PORT: 80
    volumes:
      - *mount_point-repo
      - *mount_point-scripts
      - *volume-yarn
      - *volume-shared-modules
      - *volume-login-modules
      - *mount_point-yarn_releases
    working_dir: *dir-login
    depends_on:
      core:
        condition: service_healthy
    command: [sh, -c, "yarn run start"]

  portal:
    image: node:24.18.0-alpine3.24
    stdin_open: true
    tty: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal.rule=(Host(`core.leav.localhost`) &&
        PathPrefix(`/app/portal`)) || Host(`portal.leav.localhost`)"
      - "traefik.http.services.portal.loadbalancer.server.port=3000"
      - "traefik.http.routers.portal.entrypoints=web"
      - "traefik.http.routers.portal.priority=100"
    environment:
      <<: [*env-react, *env-portal]
      PUBLIC_URL: http://core.leav.localhost/app/portal
    volumes:
      - *mount_point-repo
      - *mount_point-scripts
      - *volume-yarn
      - *volume-shared-modules
      - *volume-portal-modules
      - *mount_point-yarn_releases
    working_dir: *dir-portal
    depends_on:
      core:
        condition: service_healthy
    command: [sh, -c, "yarn run start"]

  mcp-runtime:
    profiles: ["mcp"]
    image: node:24.18.0-alpine3.24
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-runtime.rule=Host(`mcp.leav.localhost`)"
      - "traefik.http.services.mcp-runtime.loadbalancer.server.port=3000"
      - "traefik.http.routers.mcp-runtime.entrypoints=web"
    environment:
      <<: [*env-logger, *env-mcp-runtime]
    volumes:
      - *mount_point-repo
      - *mount_point-scripts
      - *volume-yarn
      - *volume-shared-modules
      - *volume-mcp_runtime-modules
      - *volume-app_root_path-modules
      - *volume-config_manager-modules
      - *volume-logger-modules
      - *volume-monitoring_server-modules
      - *mount_point-yarn_releases
    working_dir: *dir-mcp_runtime
    healthcheck: *healthcheck-localhost-44444
    depends_on:
      core:
        condition: service_healthy
    command: [sh, -c, "yarn run start:watch"]

  automate-scan:
    profiles: ["automate"]
    image: node:24.18.0-alpine3.24
    restart: always
    environment:
      <<: [*env-logger, *env-automate-scan, *env-amqp]
    volumes:
      - *mount_point-repo
      - *mount_point-files
      - *mount_point-scripts
      - *volume-yarn
      - *volume-shared-modules
      - *volume-automate_scan-modules
      - *volume-app_root_path-modules
      - *volume-config_manager-modules
      - *volume-logger-modules
      - *volume-monitoring_server-modules
      - *volume-utils-modules
      - *mount_point-yarn_releases
    working_dir: *dir-automate_scan
    healthcheck: *healthcheck-localhost-44444
    depends_on:
      core:
        condition: service_healthy
    command: [sh, -c, "yarn run start:watch"]

  preview-generator:
    profiles: ["automate"]
    build:
      context: ../apps/preview-generator
      dockerfile: ../../docker/DOCKERFILES/PREVIEW_GENERATOR/Dockerfile
    restart: always
    environment:
      <<: [*env-logger, *env-amqp, *env-preview-generator]
    volumes:
      - *mount_point-repo
      - *mount_point-files
      - *mount_point-previews
      - *mount_point-scripts
      - *volume-yarn
      - *volume-shared-modules
      - *volume-preview_generator-modules
      - *volume-app_root_path-modules
      - *volume-config_manager-modules
      - *volume-logger-modules
      - *volume-message_broker-modules
      - *volume-monitoring_server-modules
      - *volume-utils-modules
      - *mount_point-yarn_releases
    working_dir: *dir-preview_generator
    healthcheck: *healthcheck-localhost-44444
    depends_on:
      core:
        condition: service_healthy
    command: [sh, -c, "yarn run start:watch"]

  # At creation, we just install deps and exit.
  # Run "docker-compose run --rm sync-scan yarn start" to make the scan
  # You need to have a GRAPHQL_API_KEY defined as environment variables (eg. in a .env file)
  sync-scan:
    profiles: ["automate"]
    image: node:24.18.0-alpine3.24
    labels:
      - traefik.enable=true
    environment:
      <<: [*env-logger, *env-sync-scan, *env-amqp]
    depends_on:
      core:
        condition: service_healthy
    volumes:
      - *mount_point-repo
      - *mount_point-files
      - *mount_point-scripts
      - *volume-yarn
      - *volume-shared-modules
      - *volume-sync_scan-modules
      - *volume-config_manager-modules
      - *volume-message_broker-modules
      - *mount_point-yarn_releases
    working_dir: *dir-sync_scan

  # Proxy
  traefik:
    image: *traefik_image
    command:
      - "--providers.docker=true"
      - "--providers.docker.network=leav"
      - "--providers.docker.exposedbydefault=false"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      # Enable self‑routing for Traefik dashboard
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.leav.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=web"
    networks:
      - default
      - monitoring

  arangodb:
    image: *arango_image
    environment:
      ARANGO_NO_AUTH: 1
    labels:
      - traefik.enable=true
      - traefik.http.routers.arangodb.rule=Host(`arango.leav.localhost`)
      - traefik.http.services.arangodb.loadbalancer.server.port=8529
    volumes:
      - arango_data:/var/lib/arangodb3
      - arango_data_apps:/var/lib/arangodb3-apps
      - ./conf/arangodb/arangod.conf:/etc/arangodb3/arangod.conf
    ports:
      - "8529:8529"
    healthcheck:
      # The arango image does not embed any health checking tool, thus we have to run a custom command to do the healthcheck.
      # The test uses wget to make an internal HTTP request to the ArangoDB server's version endpoint.
      test: ["CMD-SHELL", "wget -qO- http://0.0.0.0:8529/_api/version"]
      start_period: 30s
      start_interval: 5s
      interval: 60s
      timeout: 2s
      retries: 15

  message-broker:
    image: *message_broker_image
    restart: always
    ports:
      - "4369:4369"
      - "5671:5671"
      - "5672:5672"
      - "15672:15672"
    labels:
      - traefik.enable=true
      - traefik.http.routers.message-broker.rule=Host(`rabbitmq.leav.localhost`)
      - traefik.http.services.message-broker.loadbalancer.server.port=15672
    volumes:
      - message-broker_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity"]
      start_period: 30s
      start_interval: 5s
      interval: 60s
      timeout: 2s
      retries: 15

  redis:
    image: *redis_image
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.services.redis.loadbalancer.server.port=6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 30s
      start_interval: 5s
      interval: 60s
      timeout: 2s
      retries: 15

  redis-commander:
    profiles: ["debug"]
    hostname: redis-commander
    image: ghcr.io/joeferner/redis-commander:0.9.1
    restart: always
    environment:
      - REDIS_HOSTS=cache:redis:6379:0,session:redis:6379:1
    labels:
      - traefik.enable=true
      - traefik.http.routers.redis-commander.rule=Host(`redis.leav.localhost`)
      - traefik.http.services.redis-commander.loadbalancer.server.port=8081
      - traefik.http.routers.redis-commander.entrypoints=web
    depends_on:
      redis:
        condition: service_healthy

  elasticsearch:
    profiles: ["logs", "debug"]
    image: elasticsearch:8.10.2
    healthcheck:
      test: ["CMD-SHELL", "curl -s --fail http://elasticsearch:9200"]
      start_period: 30s
      start_interval: 5s
      interval: 60s
      timeout: 2s
      retries: 15
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  ## Kibana is used for debugging essentially. Uncomment following lines if needed
  kibana:
    profiles: ["debug"]
    image: kibana:8.10.2
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kibana.rule=Host(`kibana.leav.localhost`)"
      - "traefik.http.routers.kibana.entrypoints=web"
    depends_on:
      elasticsearch:
        condition: service_healthy

  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.27.10
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      - MP_DATABASE=/data/mailpit.db
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailpit.rule=Host(`mailpit.leav.localhost`)
      - traefik.http.services.mailpit.loadbalancer.server.port=8025
      - traefik.http.routers.mailpit.entrypoints=web
    volumes:
      - mailpit_data:/data

