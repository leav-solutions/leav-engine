    - |
      echo "Check if version @leav/ui@$VERSION already exists on npm"
      EXISTS=$(npm --silent view @leav/ui@$VERSION version || echo "")
      if [ -n "$EXISTS" ]; then
        echo "Version @leav/ui@$VERSION already exists on npm, skipping publish."
      else
        echo "Publishing @leav/ui@$VERSION to npm"
