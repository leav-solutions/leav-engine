## E2E tests
## For merge requests and merge in develop/main branches
.disable_e2e_rule: &disable_e2e_rule
  if: $DISABLE_E2E_JOBS == "true"
  when: never

.e2e_service_arangodb: &e2e_service_arangodb
  name: arangodb:3.12
  alias: arangodb
  variables:
    ARANGO_NO_AUTH: "1"

.e2e_service_rabbitmq: &e2e_service_rabbitmq
  name: rabbitmq:3.13-management-alpine
  alias: rabbitmq

.e2e_service_redis: &e2e_service_redis
  name: redis:7.4-alpine3.21
  alias: redis

.e2e_service_mailpit: &e2e_service_mailpit
  name: axllent/mailpit:v1.27.10
  alias: mailpit

integration-test-core:
  stage: test
  services:
    - *e2e_service_arangodb
    - *e2e_service_rabbitmq
    - *e2e_service_redis
  variables:
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
    ARANGO_URL: "http://root:@arangodb:8529"
    APP_ROOT_PATH: "$CI_PROJECT_DIR/apps/core"
    AMQP_HOST: "rabbitmq"
    AMQP_PORT: "5672"
    AMQP_USERNAME: "guest"
    AMQP_PWD: "guest"
  script:
    - yarn workspaces focus core
    - yarn workspace core run test:integration
  cache:
    <<: *yarn_cache
  rules:
    - *disable_e2e_rule
    - *no_tag_rule
    - *no_duplicate_rule
    - <<: *mr_rule
      changes:
        - *new_lib_installed_changes
        - apps/core/**/*
        - libs/app-root-path/**/*
        - libs/config-manager/**/*
        - libs/logger/**/*
        - libs/message-broker/**/*
        - libs/monitoring-server/**/*
        - libs/utils/**/*

integration-test-automate-scan:
  stage: test
  services:
    - *e2e_service_rabbitmq
    - *e2e_service_redis
