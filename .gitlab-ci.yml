##########
## E2E tests
## For merge requests and merge in develop/main branches
.disable_e2e_rule: &disable_e2e_rule
  if: $DISABLE_E2E_JOBS == "true"
  when: never

.e2e_service_arangodb: &e2e_service_arangodb
  name: arangodb:3.12
  alias: arangodb
  variables:
    ARANGO_NO_AUTH: "1"

.e2e_service_rabbitmq: &e2e_service_rabbitmq
  name: rabbitmq:3.13-management-alpine
  alias: rabbitmq

.e2e_service_redis: &e2e_service_redis
  name: redis:7.4-alpine3.21
  alias: redis

.e2e_service_mailpit: &e2e_service_mailpit
  name: axllent/mailpit:v1.27.10
  alias: mailpit

integration-test-core:
  stage: test
  services:
    - *e2e_service_arangodb
    - *e2e_service_rabbitmq
    - *e2e_service_redis
  variables:
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
    ARANGO_URL: "http://root:@arangodb:8529"
    APP_ROOT_PATH: "$CI_PROJECT_DIR/apps/core"
    AMQP_HOST: "rabbitmq"
    AMQP_PORT: "5672"
    AMQP_USERNAME: "guest"
    AMQP_PWD: "guest"
  script:
    - yarn workspaces focus core
    - yarn workspace core run test:integration
  cache:
    <<: *yarn_cache
  rules:
    - *disable_e2e_rule
    - *no_tag_rule
    - *no_duplicate_rule
    - <<: *mr_rule
      changes:
        - *new_lib_installed_changes
        - apps/core/**/*
        - libs/app-root-path/**/*
        - libs/config-manager/**/*
        - libs/logger/**/*
        - libs/message-broker/**/*
        - libs/monitoring-server/**/*
        - libs/utils/**/*

integration-test-automate-scan:
  stage: test
  services:
    - *e2e_service_rabbitmq
    - *e2e_service_redis
  variables:
    APP_ROOT_PATH: "$CI_PROJECT_DIR/apps/automate-scan"
    AMQP_HOST: "rabbitmq"
    AMQP_PORT: "5672"
    AMQP_USERNAME: "guest"
    AMQP_PWD: "guest"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
  script:
    - yarn workspaces focus automate-scan
    - yarn workspace automate-scan run test:integration
  cache:
    <<: *yarn_cache
  rules:
    - *disable_e2e_rule
    - *no_tag_rule
    - *no_duplicate_rule
    - <<: *mr_rule
      changes:
        - *new_lib_installed_changes
        - apps/automate-scan/**/*
        - libs/app-root-path/**/*
        - libs/config-manager/**/*
        - libs/logger/**/*
        - libs/message-broker/**/*
        - libs/monitoring-server/**/*
        - libs/utils/**/*

e2e-api:
  stage: test
  services:
    - *e2e_service_arangodb
    - *e2e_service_rabbitmq
    - *e2e_service_redis
    - *e2e_service_mailpit
    # Dont need elasticsearch for api tests, but could be added if needed (see file history)
  variables:
    ARANGO_URL: "http://root:@arangodb:8529"
    AUTH_KEY: "123456789"
    AMQP_HOST: "rabbitmq"
    AMQP_PORT: "5672"
    AMQP_USERNAME: "guest"
    AMQP_PWD: "guest"
    MAILER_HOST: "mailpit"
    MAILER_PORT: "1025"
    MAILER_SECURE: "false"
    MAILER_REQUIRE_TLS: "false"
    APP_ROOT_PATH: "$CI_PROJECT_DIR/apps/core"
    IMPORT_DIR: "$CI_PROJECT_DIR/imports"
    DISK_CACHE_DIRECTORY: "$CI_PROJECT_DIR/cache"
    FILES_ROOT_PATHS: "files1:$CI_PROJECT_DIR/files"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
  script:
    - yarn workspaces focus core
    - yarn workspace core run test:e2e:api
  cache:
    <<: *yarn_cache
  rules:
    - *disable_e2e_rule
    - *no_tag_rule
    - *no_duplicate_rule
    - <<: *mr_rule
      changes:
        - *new_lib_installed_changes
        - apps/core/**/*
        - libs/app-root-path/**/*
        - libs/config-manager/**/*
        - libs/logger/**/*
        - libs/message-broker/**/*
        - libs/monitoring-server/**/*
        - libs/utils/**/*

e2e-indexation-manager:
  stage: test
  services:
    - *e2e_service_arangodb
    - *e2e_service_rabbitmq
    - *e2e_service_redis
    # Dont need elasticsearch for api tests, but could be added if needed (see file history)
  variables:
