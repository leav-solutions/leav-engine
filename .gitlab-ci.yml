## Build / push docker images
## For develop branch and release/tags
.docker_in_docker_image: &docker_in_docker_image docker:28.2.2-dind
.docker_image: &docker_image docker:28.2.2-cli

.docker_build_variables: &docker_build_variables
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_BUILDKIT: 1
    
.default_docker_build: &default_docker_build
  image: *docker_image
  services:
    - *docker_in_docker_image
  stage: build
  rules:
    - if: $DISABLE_BUILD_DOCKER_JOBS == "true"
      when: never
    - if: ($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "develop") && $DOCKER_PLATFORM == "linux/arm64"
      needs:
        - job: build-docker-arm64
      when: on_success
    - if: ($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "develop") && $DOCKER_PLATFORM == "linux/amd64"
      when: on_success
  variables:
    <<: *docker_build_variables
  parallel:
    matrix:
      - DOCKER_PLATFORM:
        - linux/amd64
        - linux/arm64
  before_script:
    - apk add --no-cache jq findutils
    # Check if CI_REGISTRY_USER is set to skip docker login for gitlab-ci-local
    - |
      echo "Login to docker registry if CI_REGISTRY_USER is defined"
      if [ -n "$CI_REGISTRY_USER" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
        export DOCKER_PUSH="--push"
      else
        echo "CI_REGISTRY_USER non défini, skip docker login"
        export DOCKER_PUSH=""
      fi
    # Use different image tag for arm64 to avoid push conflict.
    # By default, latest push would have override first push (amd64 generally)
    # A solution would be to build image with single `docker buildx build` command and use --platform linux/amd64,linux/arm64 option,
    # Another solution could be to use `docker buildx imagetools create` from two image tag/sha
    # But because arm64 image are not allways built, this could result to a desynchronized code for same tag !
    - |
      echo "Defined docker image tag depending on CI_COMMIT_TAG and DOCKER_PLATFORM"
      if [ "$DOCKER_PLATFORM" == "linux/arm64" ]; then
        DOCKER_IMAGE_TAG_SUFFIX="-arm64"
      else
        DOCKER_IMAGE_TAG_SUFFIX=""
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        export DOCKER_IMAGE_TAG="--tag $CI_REGISTRY_IMAGE/$DOCKER_IMAGE_APP:$CI_COMMIT_TAG$DOCKER_IMAGE_TAG_SUFFIX"
        export DOCKER_IMAGE_LATEST="--tag $CI_REGISTRY_IMAGE/$DOCKER_IMAGE_APP:latest$DOCKER_IMAGE_TAG_SUFFIX"
      else
        export DOCKER_IMAGE_TAG="--tag $CI_REGISTRY_IMAGE/$DOCKER_IMAGE_APP:develop$DOCKER_IMAGE_TAG_SUFFIX"
        export DOCKER_IMAGE_LATEST=""
      fi
    # Necessary to build linux/arm64 images on amd64 runners, use qemu !
    # This will create application/vnd.oci.image.index.v1+json mediaType instead of application/vnd.docker.distribution.manifest.v2+json mediaType
    # Not a problem, but gitlab registry will display a warning and wont be able to compute image size
    - |
      echo "Create docker buildx builder if DOCKER_PLATFORM is linux/arm64"
      if [ "$DOCKER_PLATFORM" == "linux/arm64" ]; then
        docker buildx create --use --driver docker-container --name builder
      fi
  after_script:
    - |
      echo "Remove docker buildx builder if DOCKER_PLATFORM is linux/arm64" 
      if [ "$DOCKER_PLATFORM" == "linux/arm64" ]; then
        docker buildx rm builder
      fi

# Write version to package.json and manifest.json
.set_version: &set_version
  - |
    if [ -z "$CI_COMMIT_TAG" ]; then
      echo "Setting version to develop ($CI_COMMIT_SHA)"
      find \( -name "package.json" -o -name "manifest.json" \) \
        -not -path "*/node_modules/*" -not -path "*/__tests__/*" -type f \
        -exec sh -c 'jq ".version = \"develop ($CI_COMMIT_SHA)\"" {} > tmpfile && mv tmpfile {}' \;
    fi

# May be replace with a child pipeline for docker image build
# Or use https://docs.docker.com/build/building/multi-platform/ if performance are good enough,
# but probably not will we use qemu !
build-docker-arm64:
  stage: build
  when: manual
  allow_failure: true
  script:
    - echo "Build arm64 docker images on demand only"
  rules:
    - if: $DISABLE_BUILD_DOCKER_JOBS == "true"
      when: never
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "develop"
      when: manual

build-docker-core:
  <<: *default_docker_build
  variables:
    <<: *docker_build_variables
    DOCKER_IMAGE_APP: "core"
  script:
    - *set_version
    - docker buildx build
        --platform $DOCKER_PLATFORM
        --file docker/DOCKERFILES/build/core.Dockerfile
        --label "LEAV Engine"
        --label "Core"
        $DOCKER_IMAGE_TAG
        $DOCKER_IMAGE_LATEST
        $DOCKER_PUSH
        .

build-docker-preview-generator:
  <<: *default_docker_build
  variables:
    <<: *docker_build_variables
    DOCKER_IMAGE_APP: "preview-generator"
  script:
