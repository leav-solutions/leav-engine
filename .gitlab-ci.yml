build-docker-arm64:
  stage: build
  tags:
    - docker-build
  when: manual
  allow_failure: true
  script:
    - echo "Build arm64 docker images on demand only"
  rules:
    - if: $DISABLE_BUILD_DOCKER_JOBS == "true"
      when: never
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "develop"
      when: manual

