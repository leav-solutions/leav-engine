default:
  image: node:24.18.0-alpine3.24
  interruptible: true
  tags:
    - docker-dev

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG
      auto_cancel:
        on_new_commit: none
    - if: $CI_MERGE_REQUEST_TITLE =~ /^Draft:/ || $CI_MERGE_REQUEST_TITLE =~ /^WIP:/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_job_failure: all
    - when: always

.no_tag_rule: &no_tag_rule
  if: $CI_COMMIT_TAG
  when: never

.no_duplicate_rule: &no_duplicate_rule
  if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
  when: never

.mr_rule: &mr_rule
  if: $CI_PIPELINE_SOURCE == "merge_request_event"
  when: on_success

.schedule_e2e_playwright: &schedule_e2e_playwright
  if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop" && $SCHEDULED_ACTION == "e2e-playwright"
  when: on_success

.schedule_dependency_audit: &schedule_dependency_audit
  if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop" && $SCHEDULED_ACTION == "dependency-audit"
  when: on_success

.new_lib_installed_changes: &new_lib_installed_changes yarn.lock

# Inject the leav registry token (CI_JOB_TOKEN) into the runner home .yarnrc.yml
# so it applies to every yarn invocation in the job, whatever the cwd. The
# committed .yarnrc.yml deliberately omits this token so local devs keep using
# their own PAT from ~/.yarnrc.yml. Must run after yarn 4 is active.
.leav_npm_auth: &leav_npm_auth yarn config set --home npmScopes.leav.npmAuthToken "${CI_JOB_TOKEN}"

variables:
  GIT_DEPTH: 1 # clone only the last commit to speed up the pipeline
  NODE_ENV: test
  YARN_CACHE_FOLDER: .yarn_cache
  # https://docs.gitlab.com/runner/configuration/feature-flags/
  FF_USE_FASTZIP: "true"
  FF_TIMESTAMPS: "true"
  # https://docs.gitlab.com/ci/runners/configure_runners/#artifact-and-cache-settings
  ARTIFACT_COMPRESSION_LEVEL: "default"
  # bigger archive, but should not be a problem for local storage, or local s3 storage
  CACHE_COMPRESSION_LEVEL: "fastest"
  # For ci development, could be removed once ci goes to production
  DISABLE_CHECK_JOBS: "false"
  DISABLE_TEST_JOBS: "false"
  DISABLE_E2E_JOBS: "false"
  DISABLE_E2E_PLAYWRIGHT_JOBS: "false"
  DISABLE_BUILD_DOCKER_JOBS: "false"
  DISABLE_BUILD_NPM_JOBS: "false"
  # If use npmjs.org public registry
  NPM_TOKEN: ""

stages:
  - test
  - build
  - post-build-test

.yarn_cache: &yarn_cache
  key:
    files:
      - yarn.lock
  paths:
    - .yarn_cache
  policy: pull

##########
## Other checks
## For merge requests and merge in develop/main branches
.disable_check_rule: &disable_check_rule
  if: $DISABLE_CHECK_JOBS == "true"
  when: never

.check_ci_rules: &check_ci_rules
  - *disable_check_rule
  - *no_tag_rule
  - *no_duplicate_rule
  - *mr_rule

lint:
  stage: test
  script:
    - yarn install --immutable
    - yarn run prettier:check
    - yarn run lint:check --format gitlab
  cache:
    <<: *yarn_cache
    policy: pull-push
  rules: *check_ci_rules
  artifacts:
    reports:
      codequality: gl-codequality.json

tscheck:
  stage: test
  script:
    - yarn install --immutable
    - yarn run tscheck
  cache:
    <<: *yarn_cache
  rules: *check_ci_rules

translations-check:
  stage: test
  script:
    - node ./scripts/compareTranslations.js
  rules: *check_ci_rules

# https://docs.renovatebot.com/config-validation/
validate-renovate-config:
  stage: test
  script:
    - npx --yes --package renovate -- renovate-config-validator
  cache:
    <<: *yarn_cache
  rules:
    - *disable_check_rule
    - *no_tag_rule
    - *no_duplicate_rule
    - <<: *mr_rule
      changes:
        - renovate.json

audit-production-dependencies:
  stage: test
  script:
    # Human-readable output in the logs; its exit code drives the job status
    - yarn npm audit --recursive --severity high --environment production --all
  rules:
    - *disable_check_rule
    - *schedule_dependency_audit
    - <<: *mr_rule
      allow_failure: true # informational job: never breaks the pipeline
      changes:
        - yarn.lock
    - <<: *mr_rule
      allow_failure: true # informational job: never breaks the pipeline
      when: manual
