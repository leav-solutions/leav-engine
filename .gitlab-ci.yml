        - libs/app-root-path/**/*
        - libs/config-manager/**/*
        - libs/logger/**/*
        - libs/message-broker/**/*
        - libs/utils/**/*

.e2e_service_leav_core: &e2e_service_leav_core # May be use build images from same MR pipeline in the future
  name: registry.aristid.com/dev/leav/leav/core:$LEAV_DOCKER_IMAGE_TAG
  alias: leav_core
  pull_policy: always
  command:
    [
      "sh",
      "-x",
      "-c",
      "echo 'En attente des services...' && until nc -zvw 30 arangodb 8529 && nc -zvw 30 rabbitmq 5672 && nc -zvw 30 redis 6379; do sleep 1; done && yarn run db:migrate && yarn run start",
    ]
  variables:
    CORE_MODE: e2ePlaywright
    NODE_ENV: development
    ARANGO_URL: "http://root:@arangodb:8529"
    DB_NAME: leav_core
    AUTH_KEY: "123456789"
    AUTH_COOKIE_SECURE: "false"
    TEST_API_KEY: "e2e-playwright-test-api-key"
    AMQP_HOST: "rabbitmq"
    AMQP_PORT: "5672"
    AMQP_USERNAME: "guest"
    AMQP_PWD: "guest"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
    LOG_LEVEL: "silly"
    SERVER_PUBLIC_URL: http://leav_core:4001
    SERVER_SUPPORT_EMAIL: support@example.com
    SERVER_ADMIN_LOGIN: admin
    SERVER_ADMIN_PASSWORD: admin
    SERVER_ADMIN_EMAIL: admin@example.com
    FILES_ROOT_PATHS: "/files"

e2e-playwright:
  stage: post-build-test
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  variables:
    FF_NETWORK_PER_BUILD: 1 # important for core to connect to services https://docs.gitlab.com/ci/services/#connecting-services
    BASE_URL: "http://leav_core:4001"
    TZ: "Europe/Paris" # Necessary for date component timestamp tests
    LEAV_DOCKER_IMAGE_TAG: develop
  services:
    - *e2e_service_arangodb
    - *e2e_service_rabbitmq
    - *e2e_service_redis
    - *e2e_service_leav_core
  before_script:
    - yarn workspaces focus e2e-playwright
  script:
    - yarn workspace e2e-playwright run start
  after_script:
    - echo "Report will be available at $CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/test-apps/e2e-playwright/playwright-report/index.html"
  artifacts:
    paths:
      - test-apps/e2e-playwright/playwright-report
    when: always
  needs:
    - job: build-docker-core
      parallel:
        matrix:
          - DOCKER_PLATFORM: linux/amd64
            RUNNER: docker-build
      artifacts: false
      optional: true
  rules:
    - if: $DISABLE_E2E_PLAYWRIGHT_JOBS == "true"
      when: never
    - *no_tag_rule
    - *no_duplicate_rule
    - *schedule_e2e_playwright
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true # To make job optional in MR pipelines
      when: manual
      variables:
        LEAV_DOCKER_IMAGE_TAG: "mr-$CI_COMMIT_REF_SLUG" # With amd64 docker image, previously built in build-docker-core job
    - if: $CI_COMMIT_BRANCH == "develop"
      allow_failure: true # To make job optional for now
      when: manual

