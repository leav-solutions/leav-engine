## Build / push docker images
## For develop branch and release/tags
.docker_in_docker_image: &docker_in_docker_image docker:28.2.2-dind
.docker_image: &docker_image docker:28.2.2-cli

.default_docker_build: &default_docker_build
  image: *docker_image
  tags:
    - ${RUNNER}
  services:
    - *docker_in_docker_image
  stage: build
  rules:
    - if: $DISABLE_BUILD_DOCKER_JOBS == "true"
      when: never
    - if: ($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "develop") && $DOCKER_PLATFORM == "linux/arm64"
      needs:
        - job: build-docker-arm64
      when: on_success
    - if: ($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "develop") && $DOCKER_PLATFORM == "linux/amd64"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true # To make job optional in MR pipelines
      when: manual
  parallel:
    matrix:
      - DOCKER_PLATFORM: linux/amd64
        RUNNER: docker-build
      - DOCKER_PLATFORM: linux/arm64
        RUNNER: docker-build-macos-arm64
  before_script:
    # Use different image tag for arm64 to avoid push conflict.
    # By default, latest push would have override first push (amd64 generally)
    # A solution would be to build image with single `docker buildx build` command and use --platform linux/amd64,linux/arm64 option,
    # Another solution could be to use `docker buildx imagetools create` from two image tag/sha
    # But because arm64 image are not allways built, this could result to a desynchronized code for same tag !
    - |
      echo "Defined docker image tag depending on CI_COMMIT_TAG and DOCKER_PLATFORM"
      if [ "$DOCKER_PLATFORM" == "linux/arm64" ]; then
        DOCKER_IMAGE_TAG_SUFFIX="-arm64"
      else
        DOCKER_IMAGE_TAG_SUFFIX=""
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        export DOCKER_IMAGE_TAG="--tag $CI_REGISTRY_IMAGE/$DOCKER_IMAGE_APP:$CI_COMMIT_TAG$DOCKER_IMAGE_TAG_SUFFIX"
        export DOCKER_IMAGE_LATEST="--tag $CI_REGISTRY_IMAGE/$DOCKER_IMAGE_APP:latest$DOCKER_IMAGE_TAG_SUFFIX"
        export DOCKER_PUSH="--push"
      elif [ "$CI_COMMIT_BRANCH" == "develop" ]; then
        export DOCKER_IMAGE_TAG="--tag $CI_REGISTRY_IMAGE/$DOCKER_IMAGE_APP:develop$DOCKER_IMAGE_TAG_SUFFIX"
        export DOCKER_IMAGE_LATEST=""
        export DOCKER_PUSH="--push"
      elif [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then
        # Manual job trigger, no tag or develop branch, do not push anything
        export DOCKER_IMAGE_TAG=""
        export DOCKER_IMAGE_LATEST=""
        export DOCKER_PUSH=""
      fi
    # Runner docker-build-macos-arm64 need to login to registry
    - |
      echo "Docker login for runner docker-build-macos-arm64 has needed"
      if [ "$RUNNER" == "docker-build-macos-arm64" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
      fi
  after_script:
    - |
      echo "Remove docker images from local storage to save space"
      docker rmi $(docker images --filter=reference="$CI_REGISTRY_IMAGE/$DOCKER_IMAGE_APP:*" --format "{{.Repository}}:{{.Tag}}")

# Write version to package.json and manifest.json
.set_version: &set_version
  - |
    if [ -z "$CI_COMMIT_TAG" ]; then
      echo "Setting version to develop ($CI_COMMIT_SHA)"
      # Ensure compatibility with macOS (BSD find) and Linux (GNU find)
      if command -v gfind >/dev/null 2>&1; then
        FIND_CMD="gfind"
      else
        FIND_CMD="find"
      fi
      $FIND_CMD \( -name "package.json" -o -name "manifest.json" \) \
        -not -path "*/node_modules/*" -not -path "*/__tests__/*" -type f \
        -exec sh -c 'jq ".version = \"develop ($CI_COMMIT_SHA)\"" {} > tmpfile && mv tmpfile {}' \;
    fi

# May be replace with a child pipeline for docker image build
# Or use https://docs.docker.com/build/building/multi-platform/ if performance are good enough,
