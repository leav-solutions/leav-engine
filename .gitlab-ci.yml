## Publish npm packages

.login_npm_registry_script: &login_npm_registry_script
  - |
    if [ -n "$NPM_TOKEN" ]; then
      echo "Login to public npm registry with NPM_TOKEN"
      echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    elif [ -n "$CI_JOB_TOKEN" ]; then
      echo "Login to private npm $CI_SERVER_HOST with CI_JOB_TOKEN"
      echo "registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
      echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    else
      echo "NPM_TOKEN or CI_JOB_TOKEN not defined, skip npm login"
    fi

publish-npm-leav-types-next:
  stage: build
  script:
    - apk add --no-cache jq
    - *login_npm_registry_script
    - *yarn_install_if_not_exists
    - VERSION=$(yarn workspace @aristid/leav-types get-version)-$CI_COMMIT_SHORT_SHA
    - |
      echo "Check if version @aristid/leav-types@$VERSION already exists on npm"
      EXISTS=$(npm --silent view @aristid/leav-types@$VERSION version || echo "")
      if [ -n "$EXISTS" ]; then
        echo "Version @aristid/leav-types@$VERSION already exists on npm, skipping publish."
      else
        echo "Publishing @aristid/leav-types@$VERSION to npm"
        echo yarn workspace @aristid/leav-types generate
        yarn workspace @aristid/leav-types generate
        # Do not use 'yarn workspace @aristid/leav-types version xxx' because it needs git !
        echo yarn workspace @aristid/leav-types set-version -- $VERSION
        yarn workspace @aristid/leav-types set-version -- $VERSION
        echo yarn workspace @aristid/leav-types publish-types --tag next
        yarn workspace @aristid/leav-types publish-types --tag next
      fi
  cache:
    <<: *node_modules_cache
  rules:
    - if: $DISABLE_PUBLISH_NPM_JOBS == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
      changes:
      # libs/types is a projection of apps/core
      - apps/core/**/*
      when: on_success

publish-npm-leav-ui-next:
