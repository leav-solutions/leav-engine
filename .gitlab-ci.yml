default:
  image: node:18-alpine3.18
  interruptible: true

.no_tag_rule: &no_tag_rule
  if: $CI_COMMIT_TAG
  when: never

.mr_rule: &mr_rule
  if: $CI_PIPELINE_SOURCE == "merge_request_event"
  when: on_success

.no_duplicate_rule: &no_duplicate_rule
  if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
  when: never

.main_and_develop_branches_rule: &main_and_develop_branches_rule
  if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")
  when: on_success

# To update, run the following command:
# yarn workspaces list --json | jq 'select(.location | contains("test-apps") | not)' | jq -r '.name | "  - \"\(.)\""'
# Hardcoded list because it is not possible to get the list of workspaces from yarn in the CI/CD pipeline
# and use it for parallel job matrix
.workspace_projects_name: &workspace_projects_name
  - "leav-monorepo"
  - "admin"
  - "automate-scan"
  - "core"
  - "data-studio"
  - "login"
  - "logs-collector"
  - "portal"
  - "preview-generator"
  - "skeleton-app"
  - "sync-scan"
  - "@leav/app-root-path"
  - "@leav/config-manager"
  - "@leav/message-broker"
  - "@aristid/leav-types"
  - "@leav/ui"
  - "@leav/utils"

variables:
  GIT_DEPTH: 1 # clone only the last commit to speed up the pipeline
  NODE_ENV: test
  YARN_CACHE_FOLDER: .yarn_cache
  # https://docs.gitlab.com/runner/configuration/feature-flags/
  FF_USE_FASTZIP: "true"
  FF_TIMESTAMPS: "true"
  # https://docs.gitlab.com/ci/runners/configure_runners/#artifact-and-cache-settings
  ARTIFACT_COMPRESSION_LEVEL: "default"
  # bigger archive, but should not be a problem for local storage, or local s3 storage
  CACHE_COMPRESSION_LEVEL: "fastest" 
  # For ci development, could be removed once ci goes to production
  DISABLE_CHECK_JOBS: "false"
  DISABLE_TEST_JOBS: "false"
  DISABLE_E2E_JOBS: "false"
  DISABLE_BUILD_DOCKER_JOBS: "false"
  DISABLE_PUBLISH_NPM_JOBS: "false"
  # If use npmjs.org public registry
  NPM_TOKEN: ""

stages:
  - install
  - test
  - build

##########
## Install
## For merge requests and merge in develop/main branches
.node_modules_cache: &node_modules_cache
  key:
    files:
      - yarn.lock
    prefix: $CI_RUNNER_EXECUTABLE_ARCH
  paths:
    - node_modules/
    - apps/*/node_modules/
    - libs/*/node_modules/
    - test-apps/*/node_modules/
    # Do no add .yarn_cache because node_modules should be enough
  policy: pull

# Necessary in case of cache not available (different runner, etc.)
.yarn_install_if_not_exists: &yarn_install_if_not_exists
  - |
    echo "Check if node_modules exists and if it is up to date";
    if [ -d node_modules ] && [ -f node_modules/.cache/last-successful-install ]; then
      echo "node_modules already exists, skip yarn install";
    else
      yarn install --immutable &&
      mkdir -p node_modules/.cache &&
      touch node_modules/.cache/last-successful-install;
    fi

.install_ci_rules: &install_ci_rules
  - *no_tag_rule
  - *no_duplicate_rule
  - *mr_rule
  - *main_and_develop_branches_rule

install:
  stage: install
  script:
    - *yarn_install_if_not_exists
  cache:
    <<: *node_modules_cache
    # pull if exists, push after that job,
    # but is efficient only if other jobs run in same runner instance when cache is not share with s3
    policy: pull-push
  rules: *install_ci_rules

## Install
##########

##########
## Divers checks
## For merge requests and merge in develop/main branches
.check_ci_rules: &check_ci_rules
  - if: $DISABLE_CHECK_JOBS == "true"
    when: never
  - *no_tag_rule
  - *no_duplicate_rule
  - *mr_rule
  - *main_and_develop_branches_rule

lint:
  stage: test
  script:
    - *yarn_install_if_not_exists
    - yarn lint
  cache:
    <<: *node_modules_cache
  rules: *check_ci_rules

license-check:
  stage: test
  script:
    - *yarn_install_if_not_exists
    - yarn license:check
  cache:
    <<: *node_modules_cache
  rules: *check_ci_rules

tscheck:
  stage: test
  script:
    - *yarn_install_if_not_exists
    - yarn tscheck
  cache:
    <<: *node_modules_cache
  rules: *check_ci_rules

translations-check:
  stage: test
  script:
    - *yarn_install_if_not_exists
    - yarn translations:check
  cache:
    <<: *node_modules_cache
  rules: *check_ci_rules

## Divers checks
##########

##########
## Unit tests
## For merge requests and merge in develop/main branches
.test_ci_rules: &test_ci_rules
  - if: $DISABLE_TEST_JOBS == "true"
    when: never
  - *no_tag_rule
  - *no_duplicate_rule
  - *mr_rule
  - *main_and_develop_branches_rule

check-workspaces-list:
  stage: test
  script:
    # Prepare image ? maybe image with that tools already exists?
    - apk add --no-cache yq jq
    # Check if yarn workspaces list matches the .gitlab-ci.yml .workspace_projects_name
    - |
      echo "Check if .gitlab-ci.yml .workspace_projects_name matches yarn workspaces list output";
      CI_WORKSPACES_NAME=$(cat .gitlab-ci.yml | yq -r '.[".workspace_projects_name"][]')
      YARN_WORKSPACES_NAME=$(yarn workspaces list --json | jq 'select(.location | contains("test-apps") | not)' | jq -r '.name')
      if [ "$CI_WORKSPACES_NAME" != "$YARN_WORKSPACES_NAME" ]; then
        echo "Please update .gitlab-ci.yml .workspace_projects_name to match yarn workspaces list output.";
        exit 1;
      fi
  rules: *test_ci_rules

workspace-unit-tests:
  stage: test
  needs:
    - job: check-workspaces-list
  parallel:
    matrix:
      - WORKSPACE_NAME: *workspace_projects_name
  script:
    - *yarn_install_if_not_exists
    - yarn workspace $WORKSPACE_NAME run test:ci
  cache:
    <<: *node_modules_cache
  rules: *test_ci_rules

## Unit tests
##########

##########
## E2E tests
## For merge requests and merge in develop/main branches
.e2e_ci_rules: &e2e_ci_rules
  - if: $DISABLE_E2E_JOBS == "true"
    when: never
  - *no_tag_rule
  - *no_duplicate_rule
  - *mr_rule
  - *main_and_develop_branches_rule

.e2e_service_arangodb: &e2e_service_arangodb
  name: arangodb:3.12
  alias: arangodb
  variables:
    ARANGO_NO_AUTH: "1"

.e2e_service_rabbitmq: &e2e_service_rabbitmq
  name: rabbitmq:3.13-management-alpine
  alias: rabbitmq

.e2e_service_redis: &e2e_service_redis
  name: redis:latest
  alias: redis

# Proposed by copilote after many tries, may be not optimal but it is working
.e2e_service_elasticsearch: &e2e_service_elasticsearch
  name: docker.elastic.co/elasticsearch/elasticsearch:8.5.3
  alias: elasticsearch
  entrypoint: [""]
  command:
    - bash
    - -c
    - |
      su -s /bin/bash elasticsearch -c "/usr/local/bin/docker-entrypoint.sh eswrapper"
  variables:
    discovery.type: single-node
    xpack.security.enabled: "false"
    ES_JAVA_OPTS: -Xms256m -Xmx256m

e2e-api:
  stage: test
  services:
    - *e2e_service_arangodb
    - *e2e_service_rabbitmq
    - *e2e_service_redis
    - *e2e_service_elasticsearch
  variables:
    ARANGO_URL: "http://root:@arangodb:8529"
    AUTH_KEY: "123456789"
    AMQP_HOST: "rabbitmq"
    AMQP_PORT: "5672"
    AMQP_USERNAME: "guest"
    AMQP_PWD: "guest"
    APP_ROOT_PATH: "$CI_PROJECT_DIR/apps/core"
    ELASTICSEARCH_URL: "http://elasticsearch:9200"
    IMPORT_DIR: "$CI_PROJECT_DIR/imports"
    DISK_CACHE_DIRECTORY: "$CI_PROJECT_DIR/cache"
    FILES_ROOT_PATHS: "files1:$CI_PROJECT_DIR/files"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
  script:
    - *yarn_install_if_not_exists
    - cd apps/core
    - yarn run test:e2e:api
  cache:
    <<: *node_modules_cache
  rules: *e2e_ci_rules

e2e-indexation-manager:
  stage: test
  services:
    - *e2e_service_arangodb
    - *e2e_service_rabbitmq
    - *e2e_service_redis
    - *e2e_service_elasticsearch
  variables:
    ARANGO_URL: "http://root:@arangodb:8529"
    AUTH_KEY: "123456789"
    AMQP_HOST: "rabbitmq"
    AMQP_PORT: "5672"
    AMQP_USERNAME: "guest"
    AMQP_PWD: "guest"
    APP_ROOT_PATH: "$CI_PROJECT_DIR/apps/core"
    ELASTICSEARCH_URL: "http://elasticsearch:9200"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
  script:
    - *yarn_install_if_not_exists
    - cd apps/core
    - yarn run test:e2e:indexationManager
  cache:
    <<: *node_modules_cache
  rules: *e2e_ci_rules

e2e-sync-scan:
  stage: test
  services:
    - *e2e_service_rabbitmq
  variables:
    AMQP_HOST: "rabbitmq"
    AMQP_PORT: "5672"
    AMQP_USERNAME: "guest"
    AMQP_PWD: "guest"
    APP_ROOT_PATH: "$CI_PROJECT_DIR/apps/sync-scan"
    ALLOW_FILES_LIST: ""
    IGNORE_FILES_LIST: ""
  script:
    - *yarn_install_if_not_exists
    - cd apps/sync-scan
    - yarn run test:e2e
  cache:
    <<: *node_modules_cache
  rules: *e2e_ci_rules

