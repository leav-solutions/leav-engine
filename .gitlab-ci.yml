## Build npm packages
.disable_build_npm_rule: &disable_build_npm_rule
  if: $DISABLE_BUILD_NPM_JOBS == "true"
  when: never

.build_npm: &build_npm
  stage: build
  before_script:
    - *leav_npm_auth
  script:
    - apk add --no-cache jq
    - |
      # Use npm (not `yarn workspace … run`) to read the version: it only executes the
      # package's get-version script and needs no install state, whereas Yarn 4 requires
      # .yarn/install-state.gz which is not present yet (the install happens later, only in
      # the publish branch via `yarn workspaces focus`).
      BASE_VERSION=$(npm --silent --workspace $PKG run get-version)
      if [ -n "$CI_COMMIT_TAG" ]; then
        NPM_TAG="latest"
        VERSION="$BASE_VERSION"
      elif [ "$CI_COMMIT_BRANCH" == "develop" ]; then
        NPM_TAG="next"
        VERSION="$BASE_VERSION-$CI_COMMIT_SHORT_SHA"
      else # Merge request
        NPM_TAG="mr-$CI_COMMIT_REF_SLUG"
        VERSION="$BASE_VERSION-$CI_COMMIT_SHORT_SHA"
      fi
      echo "Check if version $PKG@$VERSION already exists on registry"
      EXISTS=$(yarn npm info "$PKG" --fields versions --json 2>/dev/null | jq -r --arg v "$VERSION" '.versions | index($v) // empty' || true)
      if [ -n "$EXISTS" ]; then
        echo "Version $PKG@$VERSION already exists on registry, skipping publish."
      else
        echo "Publishing $PKG@$VERSION to registry (tag: $NPM_TAG)"
        yarn workspaces focus $FOCUS
        yarn workspace $PKG build
        # Do not use 'yarn workspace $PKG version xxx' because it needs git !
        yarn workspace $PKG set-version -- $VERSION
        yarn workspace $PKG publish --tag $NPM_TAG
      fi
  cache:
    <<: *yarn_cache
  rules:
    - *disable_build_npm_rule
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      changes:
        - $PATH_CHANGES
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true # To make job optional in MR pipelines
      when: manual

build-npm-leav-core-types:
  <<: *build_npm
  variables:
    PKG: "@leav/core-types"
    FOCUS: core
    PATH_CHANGES: apps/core/**/* # libs/core-types is a projection of apps/core

build-npm-leav-core-publish:
  <<: *build_npm
  variables:
    PKG: "@leav/core-publish"
    FOCUS: core
