    - docker buildx build
        --platform $DOCKER_PLATFORM
        --file docker/DOCKERFILES/build/generic.Dockerfile
        --build-arg APP=$DOCKER_IMAGE_APP
        --target runner-preview-generator
        --label "LEAV Engine"
        --label "Preview Generator"
        $DOCKER_IMAGE_TAG
        $DOCKER_IMAGE_LATEST
        $DOCKER_PUSH
        . 

