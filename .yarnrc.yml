compressionLevel: mixed

defaultSemverRangePrefix: ""

enableGlobalCache: false

nodeLinker: node-modules

# new default value blocks aristid-ds (and other packages) installation for 1 day after publishing
npmMinimalAgeGate: 0

# @leav/* packages are published to (and read from) the GitLab npm registry.
npmScopes:
  leav:
    npmRegistryServer: "https://gitlab.aristid.com/api/v4/projects/822/packages/npm/"
    npmPublishRegistry: "https://gitlab.aristid.com/api/v4/projects/822/packages/npm/"
    npmAlwaysAuth: true
    # npmAuthToken in home for developers, in CI for pipelines

yarnPath: .yarn/releases/yarn-4.16.0.cjs
